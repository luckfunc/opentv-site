name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check deployment configuration
        id: config
        env:
          USER_HOST: ${{ secrets.USER_HOST }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_PASS: ${{ secrets.USER_PASS }}
          USER_TARGET: ${{ secrets.USER_TARGET }}
        run: |
          for name in USER_HOST USER_NAME USER_PASS USER_TARGET; do
            if [[ -z "${!name}" || "${!name}" == 'REPLACE_ME' ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Build succeeded. Deployment skipped: configure all deployment secrets." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to server
        if: steps.config.outputs.ready == 'true'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.USER_HOST }}
          username: ${{ secrets.USER_NAME }}
          password: ${{ secrets.USER_PASS }}
          source: "dist/"
          target: ${{ secrets.USER_TARGET }}
          strip_components: 1
          overwrite: true
